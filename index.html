<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cathy's Lifts</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B3D3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lifts">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0B3D3A; color:#F4F7F6;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:20px; padding:32px 24px; text-align:center;
    box-sizing:border-box; }
  img.icon { width:96px; height:96px; border-radius:22px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  h1 { font-size:1.35rem; font-weight:700; margin:0; letter-spacing:.01em; }
  p { margin:0; opacity:.8; font-size:.95rem; max-width:22rem; line-height:1.4; }
  a.btn { display:inline-block; background:#7DCFB6; color:#062E2B; font-weight:700;
    text-decoration:none; padding:14px 22px; border-radius:14px; font-size:1.05rem; }
  a.btn:active { transform:scale(.98); }
  .hint { font-size:.8rem; opacity:.55; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <img class="icon" src="icons/icon-192.png" alt="">
  <h1>Cathy's Lifts</h1>
  <p>Opening your tracker…</p>
  <a class="btn" id="open" href="https://script.google.com/macros/s/AKfycbxTcYVVwACktE5SY3a6k2vGmXsGVzTvp8Qc2OV75SEuQrgx3iGEfffcT-0kxcfROD0Npw/exec">Open my tracker</a>
  <p class="hint">Add this page to your Home Screen for the app icon.</p>
</div>
<script>
(function () {
  var TARGET = 'https://script.google.com/macros/s/AKfycbxTcYVVwACktE5SY3a6k2vGmXsGVzTvp8Qc2OV75SEuQrgx3iGEfffcT-0kxcfROD0Npw/exec';
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
  // Only jump straight to the tracker when opened from the Home Screen icon,
  // so Safari/Chrome can still "Add to Home Screen" on this page first.
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) {
    document.querySelector('.hint').style.display = 'none';
    try { window.location.replace(TARGET); } catch (e) {}
  } else {
    document.querySelector('p').textContent = 'Tap Share, then Add to Home Screen, to get the app icon.';
  }
})();
</script>
</body>
</html>
